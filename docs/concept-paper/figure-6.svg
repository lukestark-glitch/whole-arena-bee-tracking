<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" width="720" height="190" role="img" aria-label="Three time lanes: tracking measurements every 16.7 milliseconds, motor control about every millisecond, and the cinema camera recording continuously at thousands of frames per second. Prediction fills the time between tracking measurements.">
<style>
text{font-family:"Helvetica Neue",Arial,sans-serif}
.ln{stroke:#18222b;stroke-width:1.4;fill:none}.ln-m{stroke:#5d6b76;stroke-width:1.2;fill:none}
.ln-cam{stroke:#0f6f78;stroke-width:1.3;fill:none}.ln-bee{stroke:#b97700;stroke-width:2;fill:none}
.dash{stroke-dasharray:5 4}
.box{fill:#ffffff;stroke:#18222b;stroke-width:1.4}.box-p{fill:#f4f6f7;stroke:#18222b;stroke-width:1.4}
.box-m{fill:#f4f6f7;stroke:#5d6b76;stroke-width:1.2}
.f-ink{fill:#18222b}.f-m{fill:#5d6b76}.f-cam{fill:#0f6f78}.f-bee{fill:#b97700}.f-none{fill:none}
.t{fill:#18222b;font-size:12.5px}.tb{fill:#18222b;font-size:13px;font-weight:600}
.tm{fill:#5d6b76;font-size:12px}.tc{fill:#0f6f78;font-size:12px;font-weight:500}
.ty{fill:#b97700;font-size:12.5px;font-weight:600}.mid{text-anchor:middle}.end{text-anchor:end}
</style>
<rect width="720" height="190" fill="#ffffff"/>

<defs>
<marker id="a6" markerHeight="8" markerWidth="9" orient="auto" refX="8" refY="4"><path class="f-bee" d="M0,0 L9,4 L0,8 z"></path></marker>
</defs>
<text class="t" x="20" y="44">Tracking cameras</text><text class="tm" x="20" y="60">60 Hz</text>
<text class="t" x="20" y="104">Motor control</text><text class="tm" x="20" y="120">about 1 kHz</text>
<text class="t" x="20" y="164">Cinema camera</text><text class="tm" x="20" y="180">thousands of fps</text>
<line class="ln-m" x1="170" x2="700" y1="50" y2="50"></line>
<g class="ln-cam" stroke-width="3">
<line x1="180" x2="180" y1="34" y2="66"></line><line x1="280" x2="280" y1="34" y2="66"></line><line x1="380" x2="380" y1="34" y2="66"></line>
<line x1="480" x2="480" y1="34" y2="66"></line><line x1="580" x2="580" y1="34" y2="66"></line><line x1="680" x2="680" y1="34" y2="66"></line>
</g>
<text class="tm mid" x="230" y="28">16.7 ms</text>
<line class="ln-m" x1="184" x2="210" y1="24" y2="24"></line><line class="ln-m" x1="250" x2="276" y1="24" y2="24"></line>
<line class="ln-m" x1="170" x2="700" y1="110" y2="110"></line>
<line class="ln" stroke-dasharray="1.5 4.5" stroke-width="16" x1="180" x2="686" y1="110" y2="110"></line>
<path class="ln-bee" d="M384,66 Q430,84 470,100" marker-end="url(#a6)"></path>
<text class="ty" x="492" y="88">prediction fills the gap</text>
<rect class="f-m" height="16" opacity=".55" width="506" x="180" y="158"></rect>
<text class="tm mid" x="433" y="150">records only, takes no part in tracking</text>

</svg>
