<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="Left: the robot's stereo image with a search window around the predicted position of the selected bee, and a larger bee outside the window that is ignored. Right: the two stages, whole-arena system for identity and coarse position, robot stereo camera for fine centring and fine focus.">
<style>
text{font-family:"Helvetica Neue",Arial,sans-serif}
.ln{stroke:#18222b;stroke-width:1.4;fill:none}.ln-m{stroke:#5d6b76;stroke-width:1.2;fill:none}
.ln-cam{stroke:#0f6f78;stroke-width:1.3;fill:none}.ln-bee{stroke:#b97700;stroke-width:2;fill:none}
.dash{stroke-dasharray:5 4}
.box{fill:#ffffff;stroke:#18222b;stroke-width:1.4}.box-p{fill:#f4f6f7;stroke:#18222b;stroke-width:1.4}
.box-m{fill:#f4f6f7;stroke:#5d6b76;stroke-width:1.2}
.f-ink{fill:#18222b}.f-m{fill:#5d6b76}.f-cam{fill:#0f6f78}.f-bee{fill:#b97700}.f-none{fill:none}
.t{fill:#18222b;font-size:12.5px}.tb{fill:#18222b;font-size:13px;font-weight:600}
.tm{fill:#5d6b76;font-size:12px}.tc{fill:#0f6f78;font-size:12px;font-weight:500}
.ty{fill:#b97700;font-size:12.5px;font-weight:600}.mid{text-anchor:middle}.end{text-anchor:end}
</style>
<rect width="720" height="280" fill="#ffffff"/>

<defs>
<marker id="a5" markerHeight="8" markerWidth="9" orient="auto" refX="8" refY="4"><path class="f-ink" d="M0,0 L9,4 L0,8 z"></path></marker>
</defs>
<text class="tb" x="30" y="24">Robot's stereo image</text>
<rect class="box-p" height="200" width="300" x="30" y="40"></rect>
<circle class="f-m" cx="110" cy="180" r="20"></circle>
<text class="tm mid" x="110" y="222">larger blob, ignored</text>
<circle class="f-m" cx="270" cy="80" r="7"></circle>
<circle class="f-bee" cx="214" cy="126" r="10"></circle>
<circle class="ln-bee dash" cx="206" cy="120" r="40"></circle>
<line class="ln" x1="196" x2="216" y1="120" y2="120"></line><line class="ln" x1="206" x2="206" y1="110" y2="130"></line>
<text class="ty mid" x="206" y="68">search window</text>
<text class="tm" x="34" y="258">cross: predicted position from the arena system</text>
<!-- stages -->
<rect class="box" height="78" width="290" x="400" y="40"></rect>
<rect class="f-cam" height="78" width="6" x="400" y="40"></rect>
<text class="tb" x="418" y="62">Stage 1: whole-arena system</text>
<text class="t" x="418" y="82">which bee, where, how fast, how far</text>
<text class="tm" x="418" y="100">about 1 mm (estimate), all bees, always</text>
<line class="ln" marker-end="url(#a5)" x1="545" x2="545" y1="118" y2="160"></line>
<text class="tm" x="555" y="144">search window, coarse focus</text>
<rect class="box" height="78" width="290" x="400" y="162"></rect>
<rect class="f-bee" height="78" width="6" x="400" y="162"></rect>
<text class="tb" x="418" y="184">Stage 2: robot's stereo camera</text>
<text class="t" x="418" y="204">fine centring and fine focus</text>
<text class="tm" x="418" y="222">about 15 cm from the bee, one bee</text>

</svg>
