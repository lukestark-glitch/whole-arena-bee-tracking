<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Top view of the arena. Left: the robot's own tracker follows the largest blob and jumps between bees. Right: fixed cameras see all bees, each has an ID, and the robot follows the selected one.">
<style>
text{font-family:"Helvetica Neue",Arial,sans-serif}
.ln{stroke:#18222b;stroke-width:1.4;fill:none}.ln-m{stroke:#5d6b76;stroke-width:1.2;fill:none}
.ln-cam{stroke:#0f6f78;stroke-width:1.3;fill:none}.ln-bee{stroke:#b97700;stroke-width:2;fill:none}
.dash{stroke-dasharray:5 4}
.box{fill:#ffffff;stroke:#18222b;stroke-width:1.4}.box-p{fill:#f4f6f7;stroke:#18222b;stroke-width:1.4}
.box-m{fill:#f4f6f7;stroke:#5d6b76;stroke-width:1.2}
.f-ink{fill:#18222b}.f-m{fill:#5d6b76}.f-cam{fill:#0f6f78}.f-bee{fill:#b97700}.f-none{fill:none}
.t{fill:#18222b;font-size:12.5px}.tb{fill:#18222b;font-size:13px;font-weight:600}
.tm{fill:#5d6b76;font-size:12px}.tc{fill:#0f6f78;font-size:12px;font-weight:500}
.ty{fill:#b97700;font-size:12.5px;font-weight:600}.mid{text-anchor:middle}.end{text-anchor:end}
</style>
<rect width="720" height="300" fill="#ffffff"/>

<defs>
<marker id="a1" markerHeight="8" markerWidth="9" orient="auto" refX="8" refY="4"><path class="f-ink" d="M0,0 L9,4 L0,8 z"></path></marker>
</defs>
<text class="tb" x="20" y="24">Today: the tracker rides on the robot</text>
<text class="tb" x="380" y="24">Proposed: fixed cameras see the whole arena</text>
<!-- left arena -->
<rect class="box-p" height="150" width="320" x="20" y="50"></rect>
<polygon class="f-bee" opacity=".22" points="180,250 168,118 232,118"></polygon>
<polygon class="f-m" opacity=".18" points="180,250 96,112 142,104"></polygon>
<circle class="f-ink" cx="120" cy="112" r="6"></circle>
<circle class="f-ink" cx="200" cy="130" r="10"></circle>
<circle class="f-ink" cx="290" cy="90" r="6"></circle>
<path class="ln" d="M130,100 Q160,78 190,112" marker-end="url(#a1)"></path>
<text class="t mid" x="160" y="72">jumps to the larger blob</text>
<rect class="box" height="20" width="40" x="160" y="250"></rect>
<text class="tm" x="210" y="265">robot camera, narrow view</text>
<!-- right arena -->
<rect class="box-p" height="150" width="320" x="380" y="50"></rect>
<line class="ln-cam" x1="380" x2="560" y1="50" y2="130"></line>
<line class="ln-cam" x1="700" x2="560" y1="50" y2="130"></line>
<line class="ln-cam" x1="540" x2="560" y1="200" y2="130"></line>
<rect class="f-cam" height="12" width="12" x="374" y="44"></rect>
<rect class="f-cam" height="12" width="12" x="694" y="44"></rect>
<rect class="f-cam" height="12" width="12" x="374" y="194"></rect>
<rect class="f-cam" height="12" width="12" x="694" y="194"></rect>
<rect class="f-cam" height="12" width="12" x="534" y="44"></rect>
<rect class="f-cam" height="12" width="12" x="534" y="194"></rect>
<circle class="f-ink" cx="480" cy="112" r="6"></circle>
<circle class="f-ink" cx="660" cy="112" r="6"></circle>
<circle class="f-bee" cx="560" cy="130" r="8"></circle>
<circle class="ln-bee" cx="560" cy="130" r="15"></circle>
<text class="tm mid" x="480" y="134">ID 1</text>
<text class="tm mid" x="660" y="134">ID 3</text>
<text class="ty" x="584" y="126">ID 2, selected</text>
<line class="ln-bee dash" x1="600" x2="565" y1="250" y2="147"></line>
<rect class="box" height="20" width="40" x="580" y="250"></rect>
<text class="tm end" x="570" y="265">robot follows ID 2 only</text>
<rect class="f-cam" height="10" width="10" x="380" y="282"></rect>
<text class="tm" x="396" y="291">fixed tracking camera</text>

</svg>
