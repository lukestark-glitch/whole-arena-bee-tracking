<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bee Tracker Control Window</title>
<style>
  :root {
    --bg: #f3f4f6; --panel: #ffffffee; --text: #1f2933; --muted: #6b7280;
    --border: #d1d5db; --accent: #2563eb; --canvas: #e5e7eb; --row-sel: #dbeafe;
    --ok: #16a34a; --bad: #dc2626; --strip-bg: #f9fafbf2;
    --panel-w: 300px; --strip-h: 190px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --panel: #1b2027ee; --text: #e5e7eb; --muted: #9ca3af;
      --border: #374151; --accent: #60a5fa; --canvas: #14181d; --row-sel: #1e3a5f;
      --ok: #4ade80; --bad: #f87171; --strip-bg: #161a20f2;
    }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #view { position: fixed; left: var(--panel-w); top: 0; width: calc(100% - var(--panel-w));
    height: calc(100% - var(--strip-h)); display: block; }
  #labels { position: fixed; left: var(--panel-w); top: 0; width: calc(100% - var(--panel-w));
    height: calc(100% - var(--strip-h)); overflow: hidden; pointer-events: none; }
  .label { position: absolute; left: 0; top: 0; font-size: 11px; font-weight: 600;
    text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg); white-space: nowrap; }
  #panel { position: fixed; left: 0; top: 0; bottom: 0; width: var(--panel-w); box-sizing: border-box;
    padding: 12px 14px; overflow-y: auto; background: var(--panel);
    border-right: 1px solid var(--border); backdrop-filter: blur(6px); }
  h1 { font-size: 16px; margin: 0 0 8px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
    margin: 14px 0 6px; }
  button { padding: 5px 10px; background: var(--accent); color: #fff; border: 0;
    border-radius: 4px; cursor: pointer; font: inherit; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td:last-child { text-align: right; }
  #conn { font-weight: 600; }
  #conn.ok { color: var(--ok); } #conn.bad { color: var(--bad); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  #track-list { font-variant-numeric: tabular-nums; }
  .track-row { display: grid; grid-template-columns: 14px 34px 1fr 28px 70px; gap: 6px; white-space: nowrap;
    align-items: center; padding: 2px 4px; border-radius: 4px; cursor: pointer; }
  .track-row:hover { background: var(--canvas); }
  .track-row.selected { background: var(--row-sel); font-weight: 600; }
  .track-row span:last-child { text-align: right; }
  .empty { color: var(--muted); }
  .chip { display: block; margin: 4px 0; padding: 4px 8px; border: 1px solid var(--border);
    border-radius: 6px; }
  .chip b { color: var(--ok); }
  .chip.stopped { border-color: var(--bad); }
  .chip.stopped b { color: var(--bad); }
  .chip small { display: block; color: var(--muted); }
  #cam-warning { color: var(--bad); font-weight: 600; margin-top: 4px; }
  #strip { position: fixed; left: var(--panel-w); right: 0; bottom: 0; height: var(--strip-h);
    box-sizing: border-box; background: var(--strip-bg); border-top: 1px solid var(--border);
    display: flex; flex-direction: column; }
  #strip-head { flex: none; height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 8px; }
  #strip-head button { padding: 2px 8px; }
  #strip-body { flex: 1; display: flex; gap: 8px; padding: 0 8px 8px; overflow-x: auto;
    overflow-y: hidden; align-items: flex-start; }
  body.strip-collapsed { --strip-h: 28px; }
  body.strip-collapsed #strip-body { display: none; }
  .cam { flex: none; font-size: 11px; }
  .cam-title { color: var(--muted); }
  .cam-box { position: relative; border: 2px solid var(--border); background: var(--canvas); }
  .cam-box canvas { display: block; }
  .cam-box.silent { border-color: var(--bad); }
  .cam-box .nodata { display: none; position: absolute; inset: 0; align-items: center;
    justify-content: center; color: var(--bad); font-weight: 600; }
  .cam-box.silent .nodata { display: flex; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="labels"></div>
<div id="panel">
  <h1>Control window</h1>

  <h2>Status</h2>
  <table>
    <tr><td>Server</td><td id="conn" class="bad">disconnected</td></tr>
    <tr><td>Time t</td><td id="st-t">-</td></tr>
    <tr><td>Frame</td><td id="st-frame">-</td></tr>
    <tr><td>Tracks</td><td id="st-tracks">-</td></tr>
  </table>

  <h2>Selected bee</h2>
  <table>
    <tr><td>Track</td><td id="selected-id">none</td></tr>
    <tr><td>Speed</td><td id="sel-speed">-</td></tr>
    <tr><td>Acceleration</td><td id="sel-acc">-</td></tr>
    <tr><td>State</td><td id="sel-state">-</td></tr>
    <tr><td>Cameras</td><td id="sel-cams">-</td></tr>
  </table>
  <div style="margin-top:8px"><button id="clear">Clear</button></div>

  <h2>Cinema view</h2>
  <img id="cinema" alt="cinema view of the robot" style="width:100%;display:block;background:#000">
  <div class="empty" id="cinema-note">needs an open simulator window</div>

  <h2>Tracks</h2>
  <div id="track-list"><div class="empty">no tracks</div></div>

  <h2>Health</h2>
  <div id="nodes"></div>
  <div>Cameras per track: <span id="cam-stats">-</span></div>
  <div id="cam-warning"></div>
</div>

<div id="strip">
  <div id="strip-head"><button id="strip-toggle">Cameras</button>
    <span class="empty">detections of the latest message</span></div>
  <div id="strip-body"></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ---- constants ----
const RECONNECT_DELAY_MS = 1000;
let cinemaSocket = null;   // image stream of the cinema view, from the simulator
const TRAIL_SECONDS = 2;               // simulation seconds of trail kept per track
const TRACK_RADIUS_M = 0.008;          // display size, enlarged to be visible
const PROBATION_SCALE = 0.6;
const PROBATION_OPACITY = 0.4;
const SELECTED_SCALE = 1.6;
const HALO_RADIUS_M = 0.02;
const PRED_MARKER_RADIUS_M = 0.003;
const CAMERA_MARKER_SIZE_M = 0.01;
const PICK_RADIUS_PX = 14;
const CLICK_MOVE_LIMIT_PX = 5;
const GOLDEN_ANGLE_DEG = 137.508;      // spreads consecutive ids evenly around the hue circle
const CAM_CANVAS_WIDTH_PX = 150;
const MIN_DETECTION_RADIUS_PX = 2;
const DEFAULT_ARENA_M = [0.9, 0.3, 0.3];

// ---- helpers ----
const $ = id => document.getElementById(id);

// The one place that turns a track id into a colour (CSS string, also accepted by THREE.Color).
function trackColor(id) {
  return `hsl(${Math.round((id * GOLDEN_ANGLE_DEG) % 360)}, 70%, 50%)`;
}

// ---- scene setup ----
THREE.Object3D.DEFAULT_UP.set(0, 0, 1);   // arena frame: z is up
const canvas = $("view");
const labelLayer = $("labels");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 20);
const controls = new OrbitControls(camera, canvas);
const arenaGroup = new THREE.Group();
const cameraGroup = new THREE.Group();
scene.add(arenaGroup, cameraGroup);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(0.5, -1, 2);
scene.add(sun);

const sphereGeometry = new THREE.SphereGeometry(TRACK_RADIUS_M, 12, 8);
const haloGeometry = new THREE.SphereGeometry(HALO_RADIUS_M, 16, 12);
const predGeometry = new THREE.SphereGeometry(PRED_MARKER_RADIUS_M, 8, 6);
const cameraMarkerGeometry = new THREE.BoxGeometry(CAMERA_MARKER_SIZE_M, CAMERA_MARKER_SIZE_M,
  CAMERA_MARKER_SIZE_M);
const cameraOkMaterial = new THREE.MeshBasicMaterial({ color: 0x10b981 });
const cameraSilentMaterial = new THREE.MeshBasicMaterial({ color: 0xdc2626 });

const trackViews = new Map();   // track id -> display objects of that track
let sceneInfo = { nodes: [], minCameras: 0 };   // from the scene message
let cameraNode = new Map();     // camera id -> node id
let cameraMarkers = new Map();  // camera id -> marker mesh
let camPanels = new Map();      // camera id -> { box, canvas, width, height }
let silentNodes = new Set();
let lastTracks = null;
let selectedId = null;
let lastFrame = -1;
let camerasDirty = false;
let panelListIds = "";

// Place the orbit camera in front of the long side, looking at the arena centre.
function resetView(size) {
  const centre = new THREE.Vector3(size[0] / 2, size[1] / 2, size[2] / 2);
  controls.target.copy(centre);
  camera.position.set(centre.x, -size[0] * 1.3, size[2] * 1.5);
  controls.update();
}

// Match renderer and camera aspect to the 3D view size.
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (w === 0 || h === 0) return;
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

// Dispose geometries and materials below an object, except shared ones.
function disposeObject(obj, keep) {
  obj.traverse(o => {
    if (o.geometry && !keep.has(o.geometry)) o.geometry.dispose();
    if (o.material && !keep.has(o.material)) o.material.dispose();
  });
}

const SHARED = new Set([sphereGeometry, haloGeometry, predGeometry, cameraMarkerGeometry,
  cameraOkMaterial, cameraSilentMaterial]);

// Remove and dispose all children of a group.
function clearGroup(group) {
  for (const child of [...group.children]) {
    group.remove(child);
    disposeObject(child, SHARED);
  }
}

// Draw the arena box edges and a faint floor.
function buildArena(size) {
  clearGroup(arenaGroup);
  const box = new THREE.BoxGeometry(size[0], size[1], size[2]);
  box.translate(size[0] / 2, size[1] / 2, size[2] / 2);
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(box),
    new THREE.LineBasicMaterial({ color: 0x6b7280 }));
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(size[0], size[1]),
    new THREE.MeshBasicMaterial({ color: 0x9ca3af, transparent: true, opacity: 0.15,
                                  side: THREE.DoubleSide }));
  floor.position.set(size[0] / 2, size[1] / 2, 0);
  box.dispose();
  arenaGroup.add(edges, floor);
}

// Build a small marker for each camera.
function buildCameraMarkers(cameras) {
  clearGroup(cameraGroup);
  cameraMarkers = new Map();
  for (const cam of cameras) {
    const marker = new THREE.Mesh(cameraMarkerGeometry, cameraOkMaterial);
    marker.position.fromArray(cam.position_m);
    cameraGroup.add(marker);
    cameraMarkers.set(cam.id, marker);
  }
}

// ---- track display objects ----
// Create the sphere, halo, trail, prediction line and label for a new track.
function createTrackView(id) {
  const color = trackColor(id);
  const material = new THREE.MeshStandardMaterial({ color, transparent: true });
  const sphere = new THREE.Mesh(sphereGeometry, material);
  const halo = new THREE.Mesh(haloGeometry, new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: 0.25, depthWrite: false }));
  const trail = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color }));
  const predLine = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color }));
  const predMarker = new THREE.Mesh(predGeometry, new THREE.MeshBasicMaterial({ color }));
  const label = document.createElement("div");
  label.className = "label";
  label.textContent = String(id);
  label.style.color = color;
  labelLayer.appendChild(label);
  trail.frustumCulled = false;
  predLine.frustumCulled = false;
  scene.add(sphere, halo, trail, predLine, predMarker);
  return { id, sphere, halo, trail, predLine, predMarker, label, points: [] };
}

// Remove a track's display objects and free their GPU resources.
function removeTrackView(view) {
  for (const o of [view.sphere, view.halo, view.trail, view.predLine, view.predMarker]) {
    scene.remove(o);
    disposeObject(o, SHARED);
  }
  view.label.remove();
}

// Replace a line's geometry with one through the given points.
function setLinePoints(line, points) {
  line.geometry.dispose();
  line.geometry = new THREE.BufferGeometry().setFromPoints(points);
  line.visible = points.length >= 2;
}

// Update one track's display objects from a track entry of a tracks message.
function updateTrackView(view, track, t) {
  const pos = new THREE.Vector3().fromArray(track.pos);
  const selected = track.id === selectedId;
  const scale = selected ? SELECTED_SCALE : (track.confirmed ? 1 : PROBATION_SCALE);
  view.sphere.position.copy(pos);
  view.sphere.scale.setScalar(scale);
  view.sphere.material.opacity = track.confirmed ? 1 : PROBATION_OPACITY;
  view.halo.position.copy(pos);
  view.halo.visible = selected;
  view.label.style.display = track.confirmed ? "" : "none";

  // A snapshot can be sent again while the simulation is paused; add its point only once.
  const last = view.points[view.points.length - 1];
  if (!last || last.t !== t) view.points.push({ t, pos });
  while (view.points.length > 0 && view.points[0].t < t - TRAIL_SECONDS) view.points.shift();
  setLinePoints(view.trail, view.points.map(p => p.pos));

  const pred = new THREE.Vector3().fromArray(track.pred);
  setLinePoints(view.predLine, [pos, pred]);
  view.predMarker.position.copy(pred);
}

// Create, update and remove track views to match a tracks message.
function updateTracks(msg) {
  if (msg.frame < lastFrame) {
    for (const view of trackViews.values()) view.points = [];   // simulator restarted
  }
  lastFrame = msg.frame;
  const seen = new Set();
  for (const track of msg.tracks) {
    seen.add(track.id);
    let view = trackViews.get(track.id);
    if (!view) { view = createTrackView(track.id); trackViews.set(track.id, view); }
    updateTrackView(view, track, msg.t);
  }
  for (const [id, view] of trackViews) {
    if (!seen.has(id)) { removeTrackView(view); trackViews.delete(id); }
  }
}

// Remove every track view (used when a connection is rebuilt).
function clearTracks() {
  for (const view of trackViews.values()) removeTrackView(view);
  trackViews.clear();
  lastTracks = null;
  lastFrame = -1;
}

// Project a 3D position to pixel coordinates inside the 3D view; null if behind the camera.
function toScreen(pos) {
  const v = pos.clone().project(camera);
  if (v.z > 1) return null;
  return { x: (v.x * 0.5 + 0.5) * canvas.clientWidth, y: (-v.y * 0.5 + 0.5) * canvas.clientHeight };
}

// Move each confirmed track's text label to its projected position.
function positionLabels() {
  for (const view of trackViews.values()) {
    const p = toScreen(view.sphere.position);
    if (!p || view.label.style.display === "none") { view.label.style.visibility = "hidden"; continue; }
    view.label.style.visibility = "visible";
    view.label.style.transform = `translate(${p.x + 8}px, ${p.y - 16}px)`;
  }
}

// ---- selection ----
let socket = null;

// Ask the server to select a track (or none).
function sendSelect(trackId) {
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({ type: "select", track_id: trackId }));
  }
}

// Find the track nearest to a pointer position within the pick radius, or null.
function pickTrack(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const px = clientX - rect.left, py = clientY - rect.top;
  let best = null, bestDist = PICK_RADIUS_PX;
  for (const view of trackViews.values()) {
    const p = toScreen(view.sphere.position);
    if (!p) continue;
    const d = Math.hypot(p.x - px, p.y - py);
    if (d <= bestDist) { best = view.id; bestDist = d; }
  }
  return best;
}

// Treat a pointer press and release without much movement as a click.
function wirePicking() {
  let down = null;
  canvas.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY }; });
  canvas.addEventListener("pointerup", e => {
    if (!down) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
    down = null;
    if (moved < CLICK_MOVE_LIMIT_PX) sendSelect(pickTrack(e.clientX, e.clientY));
  });
}

// ---- panel ----
const confirmedOf = tracks => tracks.filter(t => t.confirmed);
const norm = v => Math.hypot(v[0], v[1], v[2]);

// Update connection indicator.
function setStatus(connected) {
  const el = $("conn");
  el.textContent = connected ? "connected" : "disconnected";
  el.className = connected ? "ok" : "bad";
}

// Show time, frame and track counts.
function updateStatus(msg) {
  const confirmed = confirmedOf(msg.tracks).length;
  $("st-t").textContent = `${msg.t.toFixed(2)} s`;
  $("st-frame").textContent = String(msg.frame);
  $("st-tracks").textContent = `${confirmed} confirmed / ${msg.tracks.length - confirmed} on probation`;
}

// Show the selected track's numbers, or placeholders.
function updateSelected(msg) {
  const track = msg.tracks.find(t => t.id === msg.selected);
  $("selected-id").textContent = track ? String(track.id) : "none";
  $("sel-speed").textContent = track ? `${norm(track.vel).toFixed(2)} m/s` : "-";
  $("sel-acc").textContent = track ? `${norm(track.acc).toFixed(1)} m/s²` : "-";
  $("sel-state").textContent = track ? track.state : "-";
  $("sel-cams").textContent = track ? String(track.cameras) : "-";
}

// Build one row of the track list.
function createRow(id) {
  const row = document.createElement("div");
  row.className = "track-row";
  row.dataset.trackId = String(id);
  row.innerHTML = `<i class="dot"></i><span>${id}</span><span></span><span></span><span></span>`;
  row.firstChild.style.background = trackColor(id);
  row.addEventListener("click", () => sendSelect(id));
  return row;
}

// Update the track list; rebuild only when the set of ids changes.
function updateTrackList(msg) {
  const list = $("track-list");
  const tracks = confirmedOf(msg.tracks).sort((a, b) => a.id - b.id);
  const key = tracks.map(t => t.id).join(",");
  if (key !== panelListIds) {
    panelListIds = key;
    list.replaceChildren(...(tracks.length ? tracks.map(t => createRow(t.id)) : []));
    if (!tracks.length) list.innerHTML = '<div class="empty">no tracks</div>';
  }
  tracks.forEach((t, i) => {
    const row = list.children[i];
    const cells = row.children;
    cells[2].textContent = t.state;
    cells[3].textContent = String(t.cameras);
    cells[4].textContent = `${norm(t.vel).toFixed(2)} m/s`;
    row.classList.toggle("selected", t.id === msg.selected);
  });
}

// Build the node chips once per scene message.
function buildNodeChips(nodes) {
  $("nodes").replaceChildren(...nodes.map(n => {
    const chip = document.createElement("div");
    chip.className = "chip";
    chip.id = `node-${n.id}`;
    chip.innerHTML = `${n.id}: <b>ok</b><small>${n.cameras.join(", ")}</small>`;
    return chip;
  }));
}

// Show node status and the cameras-per-track statistics.
function updateHealth(msg) {
  silentNodes = new Set(msg.health.silent_nodes);
  for (const n of sceneInfo.nodes) {
    const chip = $(`node-${n.id}`);
    if (!chip) continue;
    const stopped = silentNodes.has(n.id);
    chip.classList.toggle("stopped", stopped);
    chip.querySelector("b").textContent = stopped ? "STOPPED" : "ok";
  }
  const counts = confirmedOf(msg.tracks).map(t => t.cameras);
  if (counts.length === 0) {
    $("cam-stats").textContent = "-";
    $("cam-warning").textContent = "";
    return;
  }
  const mean = counts.reduce((a, b) => a + b, 0) / counts.length;
  $("cam-stats").textContent =
    `min ${Math.min(...counts)} / mean ${mean.toFixed(1)} / max ${Math.max(...counts)}`;
  const low = counts.filter(c => c < sceneInfo.minCameras).length;
  $("cam-warning").textContent =
    low ? `Warning: ${low} track(s) seen by fewer than ${sceneInfo.minCameras} cameras` : "";
}

// Colour camera markers red for cameras of silent nodes.
function updateCameraMarkers() {
  for (const [camId, marker] of cameraMarkers) {
    marker.material = silentNodes.has(cameraNode.get(camId)) ? cameraSilentMaterial : cameraOkMaterial;
  }
}

// ---- camera panels ----
// Build one small canvas per camera in scene order.
function buildCameraPanels(cameras) {
  camPanels = new Map();
  $("strip-body").replaceChildren(...cameras.map(cam => {
    const wrap = document.createElement("div");
    wrap.className = "cam";
    const height = Math.round(CAM_CANVAS_WIDTH_PX * cam.height_px / cam.width_px);
    wrap.innerHTML = `<div class="cam-title">${cam.id}</div>
      <div class="cam-box"><canvas width="${CAM_CANVAS_WIDTH_PX}" height="${height}"></canvas>
      <div class="nodata">no data</div></div>`;
    const cv = wrap.querySelector("canvas");
    camPanels.set(cam.id, { box: wrap.querySelector(".cam-box"), canvas: cv, width_px: cam.width_px,
                            height_px: cam.height_px });
    return wrap;
  }));
  camerasDirty = true;
}

// Draw one camera's detections of the latest message.
function drawCameraPanel(panel, detections) {
  const ctx = panel.canvas.getContext("2d");
  const sx = panel.canvas.width / panel.width_px, sy = panel.canvas.height / panel.height_px;
  ctx.clearRect(0, 0, panel.canvas.width, panel.canvas.height);
  ctx.font = "10px system-ui, sans-serif";
  ctx.textBaseline = "middle";
  for (const [u, v, size, trackId] of detections) {
    const x = u * sx, y = v * sy;
    const r = Math.max(MIN_DETECTION_RADIUS_PX, size * sx / 2);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    if (trackId < 0) {
      ctx.strokeStyle = "#9ca3af";
      ctx.lineWidth = 1;
      ctx.stroke();
    } else {
      ctx.fillStyle = trackColor(trackId);
      ctx.fill();
      ctx.fillText(String(trackId), x + r + 2, y);
    }
  }
}

// Redraw all camera panels from the latest message.
function drawCameraPanels() {
  const detections = lastTracks ? lastTracks.detections : {};
  for (const [camId, panel] of camPanels) {
    const silent = silentNodes.has(cameraNode.get(camId));
    panel.box.classList.toggle("silent", silent);
    drawCameraPanel(panel, silent ? [] : (detections[camId] || []));
  }
}

// ---- messages ----
// Rebuild everything from a scene message.
function handleScene(msg) {
  sceneInfo = { nodes: msg.nodes, minCameras: msg.min_cameras };
  cameraNode = new Map();
  for (const n of msg.nodes) for (const c of n.cameras) cameraNode.set(c, n.id);
  silentNodes = new Set();
  panelListIds = "";
  clearTracks();
  selectedId = null;
  buildArena(msg.arena_size_m);
  buildCameraMarkers(msg.cameras);
  buildNodeChips(msg.nodes);
  buildCameraPanels(msg.cameras);
  resetView(msg.arena_size_m);
  if (msg.cinema_port) connectCinema(msg.cinema_port);
}

// Show a tracks message everywhere.
function handleTracks(msg) {
  lastTracks = msg;
  selectedId = msg.selected;
  updateTracks(msg);
  updateStatus(msg);
  updateSelected(msg);
  updateTrackList(msg);
  updateHealth(msg);
  updateCameraMarkers();
  camerasDirty = true;
}

// Open the connection and reconnect after a close.
// Show the robot's cinema view. It arrives like a video feed, as JPEG images over a
// WebSocket of the simulator; the tracker itself never sees these images.
function connectCinema(port) {
  if (cinemaSocket) { cinemaSocket.onclose = null; cinemaSocket.close(); }
  cinemaSocket = new WebSocket(`ws://${location.hostname}:${port}/cinema`);
  cinemaSocket.onclose = () => setTimeout(() => connectCinema(port), RECONNECT_DELAY_MS);
  cinemaSocket.onerror = () => cinemaSocket.close();
  cinemaSocket.onmessage = event => {
    const image = document.getElementById("cinema");
    const old = image.src;
    image.src = URL.createObjectURL(event.data);
    if (old) URL.revokeObjectURL(old);
    document.getElementById("cinema-note").hidden = true;
  };
}

function connect() {
  socket = new WebSocket(`ws://${location.host}/`);
  socket.onopen = () => setStatus(true);
  socket.onclose = () => { setStatus(false); setTimeout(connect, RECONNECT_DELAY_MS); };
  socket.onerror = () => socket.close();
  socket.onmessage = event => {
    let msg;
    try { msg = JSON.parse(event.data); } catch { return; }
    if (msg.type === "scene") handleScene(msg);
    else if (msg.type === "tracks") handleTracks(msg);
  };
}

// Draw one frame.
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  positionLabels();
  if (camerasDirty) { camerasDirty = false; drawCameraPanels(); }
}

// Match the scene background to the colour scheme.
function applyBackground() {
  const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  scene.background = new THREE.Color(dark ? 0x14181d : 0xe5e7eb);
}

$("clear").addEventListener("click", () => sendSelect(null));
$("strip-toggle").addEventListener("click", () => {
  document.body.classList.toggle("strip-collapsed");
  resize();
});
window.addEventListener("resize", resize);
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyBackground);
applyBackground();
buildArena(DEFAULT_ARENA_M);
resetView(DEFAULT_ARENA_M);
wirePicking();
resize();
connect();
animate();
</script>
</body>
</html>
