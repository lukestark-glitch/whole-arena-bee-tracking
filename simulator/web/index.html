<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bee Simulator Window</title>
<link rel="stylesheet" href="/style.css">
<style>
  #view { position: fixed; left: 290px; top: 0; width: calc(100% - 290px); height: 100%; display: block; }
  #labels { position: fixed; left: 290px; top: 0; width: calc(100% - 290px); height: 100%; }
  #panel { width: 290px; }
  .nodes button { margin: 0 6px 6px 0; }
  .nodes button.stopped { background: var(--bad); }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="labels"></div>
<div id="panel">
  <h1>Simulator window</h1>
  <div class="card">Server <span id="status" class="status-bad" style="float:right">disconnected</span></div>

  <div class="card">
  <h2>Readout</h2>
  <table>
    <tr><td>Time t</td><td id="ro-t">0.00 s</td></tr>
    <tr><td>Frame</td><td id="ro-frame">0</td></tr>
    <tr><td>Flying</td><td id="ro-flying">0</td></tr>
    <tr><td>Walking</td><td id="ro-walking">0</td></tr>
    <tr><td>Sitting</td><td id="ro-sitting">0</td></tr>
    <tr><td>Mode</td><td id="ro-mode">-</td></tr>
  </table>
  </div>

  <div class="card">
  <h2>Controls</h2>
  <div class="row">
    <label for="bee_count_num">Bees</label>
    <div class="inline">
      <input type="number" id="bee_count_num" min="0" max="40" step="1">
      <input type="range" id="bee_count" min="0" max="40" step="1">
    </div>
  </div>
  <div class="row"><label for="max_speed_m_s">Max speed <span class="val" id="v-max_speed_m_s"></span></label>
    <input type="range" id="max_speed_m_s" min="0.1" max="5" step="0.1"></div>
  <div class="row"><label for="pixel_sigma_px">Pixel noise <span class="val" id="v-pixel_sigma_px"></span></label>
    <input type="range" id="pixel_sigma_px" min="0" max="5" step="0.1"></div>
  <div class="row"><label for="dropout_probability">Dropout <span class="val" id="v-dropout_probability"></span></label>
    <input type="range" id="dropout_probability" min="0" max="0.5" step="0.01"></div>
  <div class="row"><label for="time_scale">Speed of time <span class="val" id="v-time_scale"></span></label>
    <input type="range" id="time_scale" min="0.1" max="2" step="0.1"></div>
  <div class="row"><button id="paused">Pause</button></div>
  <div class="row">
    <label for="seed">Seed</label>
    <div class="inline">
      <input type="number" id="seed" step="1" value="1">
      <button id="restart">Restart</button>
    </div>
  </div>

  </div>

  <div class="card">
  <h2>Robot</h2>
  <table>
    <tr><td>Rail</td><td id="ro-rail">-</td></tr>
    <tr><td>Tilt</td><td id="ro-tilt">-</td></tr>
    <tr><td>Focus</td><td id="ro-focus">-</td></tr>
    <tr><td>Target</td><td id="ro-target">-</td></tr>
  </table>
  <div class="row"><label for="rail_max_speed_m_s">Rail speed <span class="val" id="v-rail_max_speed_m_s"></span></label>
    <input type="range" id="rail_max_speed_m_s" min="0.1" max="10" step="0.1"></div>
  <div class="row"><label for="rail_max_acceleration_m_s2">Rail acceleration <span class="val" id="v-rail_max_acceleration_m_s2"></span></label>
    <input type="range" id="rail_max_acceleration_m_s2" min="1" max="200" step="1"></div>
  <div class="row"><label for="tilt_max_speed_rad_s">Tilt speed <span class="val" id="v-tilt_max_speed_rad_s"></span></label>
    <input type="range" id="tilt_max_speed_rad_s" min="0.5" max="50" step="0.5"></div>
  <div class="row"><label for="tilt_max_acceleration_rad_s2">Tilt acceleration <span class="val" id="v-tilt_max_acceleration_rad_s2"></span></label>
    <input type="range" id="tilt_max_acceleration_rad_s2" min="10" max="2000" step="10"></div>
  <div class="row">Cinema view</div>
  <canvas id="cinema" width="250" height="141" style="width:100%;display:block;border-radius:6px"></canvas>

  </div>

  <div class="card">
  <h2>Camera nodes</h2>
  <div class="row nodes" id="nodes"></div>
  </div>

  <div class="card">
  <h2>Camera error</h2>
  <div class="row">
    <label for="displace_camera">Displace a camera</label>
    <div class="inline">
      <select id="displace_camera"></select>
      <input type="number" id="displace_deg" min="-10" max="10" step="0.5" value="1"> °
      <button id="displace">Turn</button>
    </div>
  </div>
  </div>

  <div class="card">
  <h2>Display</h2>
  <label class="switch"><input type="checkbox" id="show_cones" checked>Show view cones</label>
  <label class="switch"><input type="checkbox" id="show_camera_ids">Show camera IDs</label>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { createBee, poseBee, wingPhase, buildRobotModel, poseRobotModel, buildArenaModel,
         createCameraModel, setCameraRunning, createCameraLabels, placeCameraLabels } from "/models.js";

// ---- constants ----
const RECONNECT_DELAY_MS = 1000;
const MAX_PIXEL_RATIO = 2;             // a higher ratio costs frame rate and adds little
const BEE_LENGTH_M = 0.026;            // display size, about twice the real body length
const CONE_LENGTH_M = 0.12;            // display only
const CONE_OPACITY = 0.08;
const CAMERA_COLOR = 0x10b981;
const STOPPED_CAMERA_COLOR = 0xdc2626;
const DEFAULT_ARENA_M = [0.9, 0.3, 0.3];
const ROBOT_LIMIT_NAMES = ["rail_max_speed_m_s", "rail_max_acceleration_m_s2",
                           "tilt_max_speed_rad_s", "tilt_max_acceleration_rad_s2"];
const CONTROL_NAMES = ["bee_count", "max_speed_m_s", "pixel_sigma_px",
                       "dropout_probability", "time_scale", ...ROBOT_LIMIT_NAMES];
const CINEMA_SEND_INTERVAL_MS = 66;    // about 15 images per second to the control window
const CINEMA_JPEG_QUALITY = 0.7;
const CINEMA_BACKGROUND = "#dfe7d8";
const CINEMA_BEE_COLOR = "40, 30, 10";  // r, g, b
const CINEMA_MAX_BLUR_PX = 60;

// ---- scene setup ----
THREE.Object3D.DEFAULT_UP.set(0, 0, 1);   // arena frame: z is up
const canvas = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 20);
const controls = new OrbitControls(camera, canvas);
const arenaGroup = new THREE.Group();
const cameraGroup = new THREE.Group();
scene.add(arenaGroup, cameraGroup);
scene.add(new THREE.HemisphereLight(0xfff6e0, 0xcfc4a8, 0.9));   // soft sky and ground light
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.position.set(0.5, -1, 2);
scene.add(sun);

const robotGroup = new THREE.Group();   // rail, carriage and tilting camera
scene.add(robotGroup);
let robotInfo = null;          // robot geometry from the scene message
let robotModel = null;         // parts of the robot model that move
let bodyLengthM = 0.015;       // bee body length from the scene message
let cameraLabels = [];         // id labels of the tracking cameras

const beeMeshes = new Map();   // bee id -> bee model

let arenaSize = DEFAULT_ARENA_M;
let lastState = null;
let nodeCameras = [];   // [{id, cameras}] from the scene message

// Place the orbit camera in front of the long side, looking at the arena centre.
function resetView(size) {
  const centre = new THREE.Vector3(size[0] / 2, size[1] / 2, size[2] / 2);
  controls.target.copy(centre);
  camera.position.set(centre.x, -size[0] * 1.3, size[2] * 1.5);
  controls.update();
}

// Match renderer and camera aspect to the window size.
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, MAX_PIXEL_RATIO));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

// Remove and dispose all children of a group.
function clearGroup(group) {
  for (const child of [...group.children]) {
    group.remove(child);
    child.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) o.material.dispose();
    });
  }
}

// Draw the arena: base plate, floor, faint glass walls and frame.
function buildArena(size) {
  clearGroup(arenaGroup);
  arenaGroup.add(buildArenaModel(size));
}

// Build the camera model plus a translucent view cone for one camera.
function buildCamera(cam) {
  const group = createCameraModel(cam.position_m, cam.look_at_m);
  group.name = cam.id;

  const halfAngle = cam.fov_horizontal_rad / 2;
  const radius = CONE_LENGTH_M * Math.tan(Math.min(halfAngle, 1.5));
  const cone = new THREE.Mesh(new THREE.ConeGeometry(radius, CONE_LENGTH_M, 24, 1, true),
    new THREE.MeshBasicMaterial({ color: CAMERA_COLOR, transparent: true, opacity: CONE_OPACITY,
                                  side: THREE.DoubleSide, depthWrite: false }));
  cone.name = "cone";
  // ConeGeometry has its apex at +y; move the apex to the origin and open it along +y, the
  // view axis of the camera model.
  cone.geometry.translate(0, -CONE_LENGTH_M / 2, 0);
  cone.geometry.rotateX(Math.PI);
  cone.visible = document.getElementById("show_cones").checked;
  group.add(cone);
  cameraGroup.add(group);
}

// Remove all cameras. Only the cones are disposed: the camera models share their geometry.
function clearCameras() {
  for (const group of [...cameraGroup.children]) {
    cameraGroup.remove(group);
    const cone = group.getObjectByName("cone");
    cone.geometry.dispose();
    cone.material.dispose();
  }
}

// Build the robot model (rail, carriage with yoke and motors, tilting head).
function buildRobot(robot) {
  clearGroup(robotGroup);
  robotModel = buildRobotModel(robot);
  robotGroup.add(robotModel.group);
}

// Move the robot model: carriage along the rail, head about the x axis, sight line to the
// focus plane.
function updateRobot(robot) {
  if (!robotInfo || !robotModel || !robot) return;
  poseRobotModel(robotModel, robotInfo, robot);
  $("ro-rail").textContent = `${robot.rail_m.toFixed(3)} m`;
  $("ro-tilt").textContent = `${(robot.tilt_rad * 180 / Math.PI).toFixed(1)}°`;
  $("ro-focus").textContent = `${robot.focus_m.toFixed(3)} m`;
  $("ro-target").textContent = robot.has_target ? "following" : "none";
}

// Draw what the cinema camera sees: every bee in its narrow view as a dark disc whose edge
// gets softer the farther the bee is from the focus plane.
function drawCinema(msg) {
  const view = $("cinema"), ctx = view.getContext("2d");
  ctx.fillStyle = CINEMA_BACKGROUND;
  ctx.fillRect(0, 0, view.width, view.height);
  if (!robotInfo || !msg.robot) return;
  const cos = Math.cos(msg.robot.tilt_rad), sin = Math.sin(msg.robot.tilt_rad);
  const start = robotInfo.rail_start_m, offset = robotInfo.lens_offset_m;
  const lens = [start[0] + msg.robot.rail_m, start[1] + offset * cos, start[2] + offset * sin];
  // Pinhole: half the image width covers tan(fov / 2) times the depth.
  const halfWidth = Math.tan(robotInfo.cinema_fov_horizontal_rad / 2);
  for (const bee of msg.bees) {
    const d = [bee.pos[0] - lens[0], bee.pos[1] - lens[1], bee.pos[2] - lens[2]];
    const depth = d[1] * cos + d[2] * sin;      // along the optical axis
    const up = -d[1] * sin + d[2] * cos;        // image up
    if (depth <= 0) continue;
    const pxPerM = view.width / 2 / (depth * halfWidth);
    const u = view.width / 2 + d[0] * pxPerM, v = view.height / 2 - up * pxPerM;
    const radius = bodyLengthM / 2 * pxPerM;
    // Blur grows with the distance from the focus plane, in units of the depth of field.
    const blur = Math.min(CINEMA_MAX_BLUR_PX,
      radius * Math.abs(depth - msg.robot.focus_m) / robotInfo.depth_of_field_m);
    const gradient = ctx.createRadialGradient(u, v, Math.max(0, radius - blur), u, v, radius + blur);
    gradient.addColorStop(0, `rgba(${CINEMA_BEE_COLOR}, ${radius / (radius + blur)})`);
    gradient.addColorStop(1, `rgba(${CINEMA_BEE_COLOR}, 0)`);
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(u, v, radius + blur, 0, 2 * Math.PI);
    ctx.fill();
  }
}

// Send the cinema view to the server as a JPEG image; the server passes it on to the
// control window like a video feed.
function sendCinema() {
  if (!socket || socket.readyState !== WebSocket.OPEN) return;
  $("cinema").toBlob(blob => {
    if (blob && socket.readyState === WebSocket.OPEN) socket.send(blob);
  }, "image/jpeg", CINEMA_JPEG_QUALITY);
}

// Rebuild arena and cameras from a scene message.
function handleScene(msg) {
  arenaSize = msg.arena_size_m;
  if (msg.robot) {
    robotInfo = msg.robot;
    bodyLengthM = msg.body_length_m;
    buildRobot(robotInfo);
    const view = $("cinema");
    view.height = Math.round(view.width / robotInfo.cinema_aspect_ratio);
  }
  buildArena(arenaSize);
  clearCameras();
  msg.cameras.forEach(buildCamera);
  cameraLabels = createCameraLabels($("labels"), msg.cameras);
  $("displace_camera").replaceChildren(...msg.cameras.map(cam => new Option(cam.id, cam.id)));
  nodeCameras = msg.nodes || [];
  buildNodeButtons(nodeCameras);
  resetView(arenaSize);
}

// Make one toggle button per camera node; a click asks the server for the opposite state.
function buildNodeButtons(nodes) {
  const box = $("nodes");
  box.textContent = "";
  for (const node of nodes) {
    const button = document.createElement("button");
    button.id = `node-${node.id}`;
    button.addEventListener("click", () => {
      const stopped = !!(lastState && lastState.stopped_nodes.includes(node.id));
      sendControl("node_stopped", { node_id: node.id, stopped: !stopped });
    });
    box.appendChild(button);
  }
}

// Show running / STOPPED on the buttons; cameras of stopped nodes get a red LED and cone.
function updateNodes(stoppedIds) {
  for (const node of nodeCameras) {
    const stopped = stoppedIds.includes(node.id);
    const button = $(`node-${node.id}`);
    button.textContent = `${node.id}: ${stopped ? "STOPPED" : "running"}`;
    button.classList.toggle("stopped", stopped);
    for (const cameraId of node.cameras) {
      const group = cameraGroup.getObjectByName(cameraId);
      if (!group) continue;
      setCameraRunning(group, !stopped);
      group.getObjectByName("cone").material.color.setHex(
        stopped ? STOPPED_CAMERA_COLOR : CAMERA_COLOR);
    }
  }
}

// Create, pose and remove bee models to match the state message.
function updateBees(bees) {
  const seen = new Set();
  const now = performance.now();
  for (const bee of bees) {
    seen.add(bee.id);
    let model = beeMeshes.get(bee.id);
    if (!model) {
      model = createBee(BEE_LENGTH_M);
      scene.add(model);
      beeMeshes.set(bee.id, model);
    }
    poseBee(model, bee.pos, bee.vel, bee.state === "flying", wingPhase(bee.id, now));
  }
  for (const [id, model] of beeMeshes) {
    if (!seen.has(id)) { scene.remove(model); beeMeshes.delete(id); }
  }
}

// ---- panel ----
const $ = id => document.getElementById(id);
const activeWidgets = new Set();   // widget ids the user is currently dragging or editing

// Format a setting value for display next to its slider.
function formatValue(name, v) {
  switch (name) {
    case "max_speed_m_s": return `${v.toFixed(1)} m/s`;
    case "pixel_sigma_px": return `${v.toFixed(1)} px`;
    case "dropout_probability": return `${(v * 100).toFixed(0)} %`;
    case "time_scale": return `${v.toFixed(1)}x`;
    case "rail_max_speed_m_s": return `${v.toFixed(1)} m/s`;
    case "rail_max_acceleration_m_s2": return `${v.toFixed(0)} m/s²`;
    case "tilt_max_speed_rad_s": return `${v.toFixed(1)} rad/s`;
    case "tilt_max_acceleration_rad_s2": return `${v.toFixed(0)} rad/s²`;
    default: return String(v);
  }
}

// Set a widget from server state unless the user is using it.
function setWidget(id, value) {
  if (activeWidgets.has(id) || document.activeElement === $(id)) return;
  $(id).value = value;
}

// Show the latest server state in the readout and widgets.
function updatePanel(msg) {
  $("ro-t").textContent = `${msg.t.toFixed(2)} s`;
  $("ro-frame").textContent = String(msg.frame);
  const counts = { flying: 0, walking: 0, sitting: 0 };
  for (const b of msg.bees) if (b.state in counts) counts[b.state] += 1;
  for (const k in counts) $(`ro-${k}`).textContent = String(counts[k]);

  for (const name of CONTROL_NAMES) {
    // The time scale is not a setting of the simulated world, so it sits beside them.
    const v = name === "time_scale" ? msg.time_scale : msg.settings[name];
    if (v === undefined) continue;
    setWidget(name, v);
    if ($(`v-${name}`)) $(`v-${name}`).textContent = formatValue(name, v);
  }
  if (msg.settings.bee_count !== undefined) setWidget("bee_count_num", msg.settings.bee_count);
  setWidget("seed", msg.seed);
  $("paused").textContent = msg.paused ? "Resume" : "Pause";
  $("ro-mode").textContent = (msg.wand ? "wand run" : "bees") +
    (msg.miscalibrated ? ", miscalibrated" : "");
  updateNodes(msg.stopped_nodes || []);
}

// ---- websocket ----
let socket = null;

// Show connected / disconnected in the panel.
function setStatus(connected) {
  const el = $("status");
  el.textContent = connected ? "connected" : "disconnected";
  el.className = connected ? "status-ok" : "status-bad";
}

// Send one control change to the server if the socket is open.
function sendControl(name, value) {
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({ type: "control", name, value }));
  }
}

// Open the connection and reconnect after a close.
function connect() {
  socket = new WebSocket(`ws://${location.host}/`);
  socket.onopen = () => setStatus(true);
  socket.onclose = () => { setStatus(false); setTimeout(connect, RECONNECT_DELAY_MS); };
  socket.onerror = () => socket.close();
  socket.onmessage = event => {
    let msg;
    try { msg = JSON.parse(event.data); } catch { return; }
    if (msg.type === "scene") handleScene(msg);
    else if (msg.type === "state") {
      lastState = msg; updatePanel(msg); updateBees(msg.bees);
      updateRobot(msg.robot); drawCinema(msg);
    }
  };
}

// Wire a slider: send on input, and mark it active while dragged.
function wireSlider(name, parse) {
  const el = $(name);
  el.addEventListener("pointerdown", () => activeWidgets.add(name));
  el.addEventListener("pointerup", () => activeWidgets.delete(name));
  el.addEventListener("pointercancel", () => activeWidgets.delete(name));
  el.addEventListener("input", () => {
    const v = parse(el.value);
    if ($(`v-${name}`)) $(`v-${name}`).textContent = formatValue(name, v);
    sendControl(name, v);
  });
}

// Attach all widget handlers.
function wireControls() {
  wireSlider("bee_count", v => parseInt(v, 10));
  wireSlider("max_speed_m_s", parseFloat);
  wireSlider("pixel_sigma_px", parseFloat);
  wireSlider("dropout_probability", parseFloat);
  wireSlider("time_scale", parseFloat);
  ROBOT_LIMIT_NAMES.forEach(name => wireSlider(name, parseFloat));

  $("bee_count").addEventListener("input", () => { $("bee_count_num").value = $("bee_count").value; });
  $("bee_count_num").addEventListener("input", () => {
    const n = parseInt($("bee_count_num").value, 10);
    if (Number.isNaN(n)) return;
    const clamped = Math.max(0, Math.min(40, n));
    $("bee_count").value = clamped;
    sendControl("bee_count", clamped);
  });
  $("paused").addEventListener("click", () => {
    sendControl("paused", !(lastState && lastState.paused));
  });
  $("restart").addEventListener("click", () => {
    const seed = parseInt($("seed").value, 10);
    if (!Number.isNaN(seed)) sendControl("seed", seed);
  });
  $("displace").addEventListener("click", () => {
    const degrees = parseFloat($("displace_deg").value);
    if (Number.isNaN(degrees) || !$("displace_camera").value) return;
    sendControl("camera_displaced",
      { camera_id: $("displace_camera").value, angle_rad: degrees * Math.PI / 180 });
  });
  // One last placement after switching off hides the labels.
  $("show_camera_ids").addEventListener("change", () => {
    placeCameraLabels(cameraLabels, $("show_camera_ids").checked, camera, canvas);
  });
  $("show_cones").addEventListener("change", () => {
    const on = $("show_cones").checked;
    cameraGroup.traverse(o => { if (o.name === "cone") o.visible = on; });
  });
}

// Draw one frame.
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  // Labels are repositioned only while they are switched on.
  if ($("show_camera_ids").checked) placeCameraLabels(cameraLabels, true, camera, canvas);
}

// Match the scene background to the colour scheme.
function applyBackground() {
  const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  scene.background = new THREE.Color(dark ? 0x16140f : 0xf6f1e6);
}

window.addEventListener("resize", resize);
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyBackground);
applyBackground();
handleScene({ arena_size_m: DEFAULT_ARENA_M, cameras: [] });
wireControls();
resize();
connect();
setInterval(sendCinema, CINEMA_SEND_INTERVAL_MS);
animate();
</script>
</body>
</html>
